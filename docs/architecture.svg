<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 706" width="1040" height="706" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#34d399"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#fb7185"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="706" rx="14" fill="#0b0f19"/>

  <text x="40" y="46" font-size="23" font-weight="800" fill="url(#title)">agent-neutral-harness</text>
  <text x="40" y="70" font-size="13.5" fill="#94a3b8">Reliability, memory, and model-routing — you keep your agent loop, pass it in as execute_fn(model, task).</text>

  <!-- ============ input ============ -->
  <g font-size="12.5" fill="#e2e8f0">
    <rect x="40" y="98" width="176" height="48" rx="8" fill="#111827" stroke="#334155"/>
    <text x="128" y="119" text-anchor="middle">task</text>
    <text x="128" y="137" text-anchor="middle" font-size="11" fill="#94a3b8">+ your execute_fn</text>
  </g>

  <!-- classify -->
  <g font-size="12.5">
    <rect x="266" y="96" width="180" height="52" rx="8" fill="#0f1b2d" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="356" y="118" text-anchor="middle" fill="#e2e8f0" font-weight="600">classify_task</text>
    <text x="356" y="136" text-anchor="middle" fill="#94a3b8">1B model → category</text>
  </g>
  <line x1="218" y1="122" x2="262" y2="122" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- curator -->
  <g font-size="12.5">
    <rect x="474" y="96" width="204" height="52" rx="8" fill="#0f1b2d" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="576" y="118" text-anchor="middle" fill="#e2e8f0" font-weight="600">curate_memories</text>
    <text x="576" y="136" text-anchor="middle" fill="#94a3b8">relevance filter before inject</text>
  </g>
  <line x1="450" y1="122" x2="470" y2="122" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ============ cascade box ============ -->
  <rect x="40" y="188" width="630" height="316" rx="12" fill="#0c1424" stroke="#334155"/>
  <text x="60" y="214" font-size="15" font-weight="700" fill="#cbd5e1">run_cascade</text>
  <text x="60" y="232" font-size="12" fill="#94a3b8">cheap first · verify the real output · escalate only on an observed failure</text>

  <g font-size="12.5" fill="#e2e8f0">
    <rect x="60" y="252" width="150" height="48" rx="8" fill="#111827" stroke="#475569"/>
    <text x="135" y="281" text-anchor="middle">cheap model</text>

    <rect x="270" y="252" width="170" height="48" rx="8" fill="#111827" stroke="#475569"/>
    <text x="355" y="273" text-anchor="middle">run_all_checks</text>
    <text x="355" y="290" text-anchor="middle" font-size="10.5" fill="#94a3b8">deterministic, no model</text>

    <rect x="500" y="252" width="150" height="48" rx="8" fill="#0f2018" stroke="#34d399" stroke-opacity="0.6"/>
    <text x="575" y="281" text-anchor="middle" fill="#d1fae5">return</text>

    <rect x="270" y="352" width="170" height="48" rx="8" fill="#111827" stroke="#475569"/>
    <text x="355" y="381" text-anchor="middle">capable model</text>

    <rect x="500" y="352" width="150" height="48" rx="8" fill="#0f2018" stroke="#34d399" stroke-opacity="0.6"/>
    <text x="575" y="381" text-anchor="middle" fill="#d1fae5">return</text>
  </g>

  <line x1="212" y1="276" x2="266" y2="276" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="442" y1="276" x2="496" y2="276" stroke="#34d399" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="470" y="270" font-size="10.5" fill="#34d399">clean</text>

  <path d="M355 302 L355 348" stroke="#fb7185" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="363" y="328" font-size="10.5" fill="#fb7185">flag raised</text>
  <line x1="442" y1="376" x2="496" y2="376" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>

  <text x="60" y="440" font-size="11.5" fill="#94a3b8">checks: leaked tool-call JSON · empty output · "tests passed" with nothing run ·</text>
  <text x="60" y="457" font-size="11.5" fill="#94a3b8">filenames in the summary that aren't in the real tool output</text>
  <text x="60" y="482" font-size="11.5" fill="#64748b">every turn logged →</text>

  <!-- ============ metrics ============ -->
  <g font-size="12.5">
    <rect x="710" y="188" width="290" height="316" rx="12" fill="#160f24" stroke="#3f2d5c"/>
    <text x="730" y="214" font-size="15" font-weight="700" fill="#d8b4fe">metrics + routing memory</text>

    <rect x="730" y="232" width="250" height="60" rx="8" fill="#1e1533" stroke="#6d28d9" stroke-opacity="0.5"/>
    <text x="745" y="253" fill="#e2e8f0" font-weight="600">per-category escalation rate</text>
    <text x="745" y="271" fill="#94a3b8" font-size="11">Wilson lower bound — a lucky 18/20</text>
    <text x="745" y="285" fill="#94a3b8" font-size="11">doesn't flip the shortcut on</text>

    <rect x="730" y="304" width="250" height="60" rx="8" fill="#1e1533" stroke="#6d28d9" stroke-opacity="0.5"/>
    <text x="745" y="325" fill="#e2e8f0" font-weight="600">config_fingerprint</text>
    <text x="745" y="343" fill="#94a3b8" font-size="11">model + prompt + tool schema; a</text>
    <text x="745" y="357" fill="#94a3b8" font-size="11">change drops stale rows from the window</text>

    <rect x="730" y="376" width="250" height="60" rx="8" fill="#1e1533" stroke="#6d28d9" stroke-opacity="0.5"/>
    <text x="745" y="397" fill="#e2e8f0" font-weight="600">within-window drift</text>
    <text x="745" y="415" fill="#94a3b8" font-size="11">newer vs older half + window span;</text>
    <text x="745" y="429" fill="#94a3b8" font-size="11">flag only, never changes routing</text>

    <rect x="730" y="448" width="250" height="40" rx="8" fill="#1e1533" stroke="#6d28d9" stroke-opacity="0.5"/>
    <text x="745" y="473" fill="#94a3b8" font-size="11">shortcut hopeless categories — still sample 20%</text>
  </g>
  <path d="M258 482 L706 470" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/>

  <!-- ============ memory tiers ============ -->
  <g font-size="12.5" fill="#e2e8f0">
    <rect x="40" y="536" width="960" height="140" rx="12" fill="#0c1424" stroke="#334155"/>
    <text x="60" y="562" font-size="14" font-weight="700" fill="#cbd5e1">memory.vault</text>
    <text x="60" y="582" font-size="11.5" fill="#94a3b8">evidence-gated confidence: hypothesis → suspected → confirmed — a claim is capped at suspected until a reachable source URL is attached</text>

    <rect x="60" y="602" width="180" height="44" rx="8" fill="#111827" stroke="#475569"/>
    <text x="150" y="628" text-anchor="middle" font-size="12">hot · SQLite + vec</text>
    <rect x="290" y="602" width="180" height="44" rx="8" fill="#111827" stroke="#475569"/>
    <text x="380" y="628" text-anchor="middle" font-size="12">warm · Turso</text>
    <rect x="520" y="602" width="180" height="44" rx="8" fill="#111827" stroke="#475569"/>
    <text x="610" y="628" text-anchor="middle" font-size="12">cold · S3 / MinIO</text>
    <line x1="242" y1="624" x2="286" y2="624" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="472" y1="624" x2="516" y2="624" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>

    <rect x="770" y="602" width="210" height="44" rx="8" fill="#0f1b2d" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="875" y="622" text-anchor="middle" font-size="11.5" fill="#bae6fd">MCP server</text>
    <text x="875" y="637" text-anchor="middle" font-size="9.5" fill="#94a3b8">Claude Desktop · Cursor · Windsurf</text>
  </g>
</svg>
