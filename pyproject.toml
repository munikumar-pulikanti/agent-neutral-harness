[project]
name = "agent-neutral-harness"
version = "0.1.0"
description = "A universal, agent-neutral reliability, memory, and model-routing harness for AI coding workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp<2",
    "chromadb>=0.5.0",
    "sentence-transformers>=2.2.2",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "boto3>=1.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
]